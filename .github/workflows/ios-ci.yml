name: iOS Build

on:
  push:
    branches: [ "main", "feature/v5.8-cross-platform" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt Desktop
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: mac
          target: desktop
          arch: clang_64

      - name: Install Qt iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: mac
          target: ios
          arch: ios

      - name: Configure
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.Qt6_DIR }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ env.Qt6_DIR }}/../clang_64"

      - name: Build for simulator
        run: cmake --build build --config Release -- -sdk iphonesimulator -arch arm64
