name: iOS Build

on:
  push:
    branches: [ "main", "feature/v5.8-cross-platform" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt Desktop
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: mac
          target: desktop
          arch: clang_64

      - name: Install Qt iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: mac
          target: ios
          arch: ios

      - name: Debug Qt paths
        run: |
          echo "Qt6_DIR=$Qt6_DIR"
          ls "$Qt6_DIR/.." 2>/dev/null
          ls "$Qt6_DIR/../macos" 2>/dev/null || echo "clang_64 not found"

      - name: Configure
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.Qt6_DIR }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ env.Qt6_DIR }}/../macos" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Build for device
        run: cmake --build build --config Release -- -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO
