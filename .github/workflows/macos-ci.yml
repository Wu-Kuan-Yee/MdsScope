name: macOS Build

on:
  push:
    branches: [ "main", "feature/v5.8-cross-platform", "feature/v5.8-mobile-ssh-libssh2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.5.3"
          host: mac
          target: desktop
          arch: clang_64

      - name: Install OpenSSL
        run: brew install openssl

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build
