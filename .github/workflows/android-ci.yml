name: Android Build

on:
  push:
    branches: [ "main", "feature/v5.8-cross-platform" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses and fix SDK versions
      run: |
        yes | sdkmanager --licenses || true
        rm -rf $ANDROID_HOME/platforms/* || true
        sdkmanager "platforms;android-33" || true

    - name: Install Qt Android
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        target: 'android'
        arch: 'android_arm64_v8a'

    - name: Debug Qt paths
      run: |
        echo "Qt6_DIR=$Qt6_DIR"
        echo "QT_ROOT_DIR=$QT_ROOT_DIR"
        ls "$Qt6_DIR" 2>/dev/null || echo "Qt6_DIR not found"
        ls "$QT_ROOT_DIR" 2>/dev/null || echo "QT_ROOT_DIR not found"

    - name: Configure CMake
      run: |
        cmake -B build-android -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Android \
          -DQT_ANDROID_ABIS="arm64-v8a" \
          -DANDROID_ABI=arm64-v8a \
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" \
          -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}"

    - name: Build APK
      env:
        ANDROID_BUILD_PLATFORM: android-33
      run: cmake --build build-android --target apk -j4

    - name: Build APK
      run: cmake --build build-android --target apk -j4

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MdsScope-Android-APK
        path: build-android/android-build/build/outputs/apk/release/*.apk
