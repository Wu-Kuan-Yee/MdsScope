name: Android Build

on:
  push:
    branches: [ "main", "feature/v5.8-cross-platform" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses and fix SDK versions
      run: |
        yes | sdkmanager --licenses || true
        rm -rf $ANDROID_HOME/platforms/* || true
        sdkmanager "platforms;android-33" || true

    - name: Install Qt Desktop
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'

    - name: Install Qt Android
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'

    - name: Configure CMake
      run: |
        cmake -B build-android -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="${{ env.Qt6_DIR }}/lib/cmake/Qt6/qt.toolchain.cmake" \
          -DQT_ANDROID_ABIS="arm64-v8a" \
          -DANDROID_ABI=arm64-v8a \
          -DQT_HOST_PATH="${{ env.Qt6_DIR }}/../gcc_64"

    - name: Build APK
      env:
        ANDROID_BUILD_PLATFORM: android-33
      run: cmake --build build-android --target apk -j4

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MdsScope-Android-APK
        path: build-android/android-build/build/outputs/apk/release/*.apk
