name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build DEB (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build dpkg-dev qt6-base-dev qt6-base-dev-tools

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package DEB
        run: |
          cpack --config build/CPackConfig.cmake -G DEB
          arch="$(dpkg --print-architecture)"
          mv build/*.deb "build/mdsscope-ubuntu26.04.${arch}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdsscope-deb-${{ matrix.arch }}
          path: build/*.deb

  release:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04

    steps:
      - name: Download DEB artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mdsscope-deb-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
          generate_release_notes: true
