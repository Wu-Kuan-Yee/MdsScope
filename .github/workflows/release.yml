name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux
          - windows
          - android

permissions:
  contents: write

jobs:
  # ── Linux ───────────────────────────────────────────────────────────────────

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Install to staging
        run: DESTDIR=build/staging cmake --install build

      - name: Package DEB
        run: |
          cpack --config build/CPackConfig.cmake -G DEB
          mv build/*.deb "build/mdsscope-linux-${{ matrix.arch }}.deb"

      - name: Package RPM
        run: |
          sudo apt install -y fakeroot alien 2>/dev/null || true
          deb="$(ls build/*.deb | head -1)"
          fakeroot alien --to-rpm --scripts "$deb" 2>/dev/null || true
          rpmfile="$(ls *.rpm 2>/dev/null | head -1)"
          if [ -n "$rpmfile" ]; then mv "$rpmfile" "build/mdsscope-linux-${{ matrix.arch }}.rpm"; fi

      - name: Bundle Qt into staging (for portable zip)
        continue-on-error: true
        run: |
          LDA="${{ matrix.arch == 'amd64' && 'x86_64' || matrix.arch }}"
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LDA}.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${LDA}.AppImage"
          chmod +x linuxdeploy*.AppImage
          export QTDIR="$(dpkg -L qt6-base-dev | grep '/bin/qmake6$' | head -1 | xargs dirname)/.."
          ./linuxdeploy-${LDA}.AppImage --appdir build/staging --plugin qt 2>/dev/null || true

      - name: Package ZIP
        run: |
          strip build/staging/usr/bin/MdsScope build/staging/usr/bin/transfer 2>/dev/null || true
          (cd build/staging && zip -qr "../mdsscope-linux-${{ matrix.arch }}.zip" .)

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: mdsscope-linux-${{ matrix.arch }}-deb
          path: build/mdsscope-linux-${{ matrix.arch }}.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: mdsscope-linux-${{ matrix.arch }}-rpm
          path: build/mdsscope-linux-${{ matrix.arch }}.rpm

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: mdsscope-linux-${{ matrix.arch }}-zip
          path: build/mdsscope-linux-${{ matrix.arch }}.zip

  # ── Windows ────────────────────────────────────────────────────────────────

  windows:
    name: Windows (amd64)
    runs-on: windows-2022
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\build\windows-package\MdsScope"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\Release\MdsScope.exe $stage
          Copy-Item build\Release\transfer.exe $stage 2>$null
          windeployqt --release --compiler-runtime --no-translations --dir $stage "$stage\MdsScope.exe"
          Copy-Item resources "$stage\resources" -Recurse -ErrorAction SilentlyContinue
          Copy-Item COPYING $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "build\mdsscope-windows-amd64.zip" -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: mdsscope-windows-amd64-zip
          path: build/mdsscope-windows-amd64.zip

  # ── Android ────────────────────────────────────────────────────────────────

  android:
    name: Android (aarch64)
    runs-on: ubuntu-26.04
    if: ${{ inputs.target == 'all' || inputs.target == 'android' || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          rm -rf $ANDROID_HOME/platforms/* || true
          sdkmanager "platforms;android-33" || true

      - name: Install Qt Desktop
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: linux
          target: desktop
          arch: gcc_64

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: linux
          target: android
          arch: android_arm64_v8a

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.Qt6_DIR }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DQT_HOST_PATH="${{ env.Qt6_DIR }}/../gcc_64" \
            -Wno-deprecated

      - name: Build APK
        env:
          ANDROID_BUILD_PLATFORM: android-33
        run: cmake --build build --target MdsScope_make_apk -j4

      - name: Rename APK
        run: |
          apk=$(find build -name "*.apk" | head -1)
          cp "$apk" build/mdsscope-android-aarch64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mdsscope-android-aarch64-apk
          path: build/mdsscope-android-aarch64.apk

  # ── GitHub Release ────────────────────────────────────────────────────────

  release:
    name: Create GitHub Release
    needs:
      - linux
      - windows
      - android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mdsscope-*
          merge-multiple: true

      - name: Flatten for release
        run: |
          mkdir -p release
          find artifacts -type f | while read f; do
            cp "$f" "release/$(basename "$f")"
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
