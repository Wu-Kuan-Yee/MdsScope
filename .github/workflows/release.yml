name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - android

permissions:
  contents: write

jobs:
  # ── Linux ───────────────────────────────────────────────────────────────────

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Install to staging
        run: DESTDIR=build/staging cmake --install build

      - name: Package DEB
        run: |
          cpack --config build/CPackConfig.cmake -G DEB
          mv build/*.deb "build/MdsScope-linux-${{ matrix.arch }}.deb"

      - name: Package RPM
        run: |
          sudo apt install -y fakeroot alien 2>/dev/null || true
          deb="$(ls build/*.deb | head -1)"
          fakeroot alien --to-rpm --scripts "$deb" 2>/dev/null || true
          rpmfile="$(ls *.rpm 2>/dev/null | head -1)"
          if [ -n "$rpmfile" ]; then mv "$rpmfile" "build/MdsScope-linux-${{ matrix.arch }}.rpm"; fi

      - name: Package AppImage
        run: |
          DL_ARCH="${{ matrix.arch == 'x86_64' && 'x86_64' || 'aarch64' }}"
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${DL_ARCH}.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${DL_ARCH}.AppImage"
          chmod +x linuxdeploy*.AppImage
          export QTDIR="$(dpkg -L qt6-base-dev | grep '/bin/qmake6$' | head -1 | xargs dirname)/.."
          ./linuxdeploy-${DL_ARCH}.AppImage --appdir build/staging --plugin qt --output appimage
          mv MdsScope-*.AppImage "build/MdsScope-linux-${{ matrix.arch }}.AppImage"

      - name: Package ZIP
        run: |
          strip build/MdsScope build/transfer 2>/dev/null || true
          tar czf build/staging.tar.gz -C build/staging .
          mkdir -p build/zip-root/MdsScope
          tar xzf build/staging.tar.gz -C build/zip-root/MdsScope
          (cd build/zip-root && zip -qr ../MdsScope-linux-${{ matrix.arch }}.zip MdsScope)

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-linux-${{ matrix.arch }}-deb
          path: build/MdsScope-linux-${{ matrix.arch }}.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-linux-${{ matrix.arch }}-rpm
          path: build/MdsScope-linux-${{ matrix.arch }}.rpm

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-linux-${{ matrix.arch }}-AppImage
          path: build/MdsScope-linux-${{ matrix.arch }}.AppImage

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-linux-${{ matrix.arch }}-zip
          path: build/MdsScope-linux-${{ matrix.arch }}.zip

  # ── macOS ──────────────────────────────────────────────────────────────────

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.2"
          host: mac
          target: desktop
          arch: clang_64

      - name: Install OpenSSL
        run: brew install openssl

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Package .app bundle
        run: |
          mkdir -p build/macos-package
          cp -R build/MdsScope.app build/macos-package/
          macdeployqt build/macos-package/MdsScope.app -no-strip
          cp build/transfer build/macos-package/MdsScope.app/Contents/MacOS/ 2>/dev/null || true
          cp -R resources build/macos-package/MdsScope.app/Contents/Resources/ 2>/dev/null || true

      - name: Package DMG
        run: |
          mkdir -p build/dmg-root
          cp -R build/macos-package/MdsScope.app build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname MdsScope -srcfolder build/dmg-root \
            -ov -format UDZO "build/MdsScope-macos-${{ matrix.arch }}.dmg"

      - name: Package PKG
        run: |
          pkgbuild --root build/macos-package \
            --install-location /Applications \
            --identifier com.mdsscope.app \
            --version "$(echo '${{ github.ref_name }}' | sed 's/^v//')" \
            "build/MdsScope-macos-${{ matrix.arch }}.pkg"

      - name: Package ZIP
        run: |
          (cd build/macos-package && zip -qr "../MdsScope-macos-${{ matrix.arch }}.zip" MdsScope.app)

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-macos-${{ matrix.arch }}-dmg
          path: build/MdsScope-macos-${{ matrix.arch }}.dmg

      - name: Upload PKG
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-macos-${{ matrix.arch }}-pkg
          path: build/MdsScope-macos-${{ matrix.arch }}.pkg

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-macos-${{ matrix.arch }}-zip
          path: build/MdsScope-macos-${{ matrix.arch }}.zip

  # ── Windows ────────────────────────────────────────────────────────────────

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          - arch: arm64
            runner: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.2"
          host: windows
          target: desktop
          arch: ${{ matrix.arch == 'x86_64' && 'win64_msvc2022_64' || 'win64_msvc2022_arm64' }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" \
          -A ${{ matrix.arch == 'x86_64' && 'x64' || 'ARM64' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\build\windows-package\MdsScope"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\Release\MdsScope.exe $stage
          Copy-Item build\Release\transfer.exe $stage 2>$null
          windeployqt --release --compiler-runtime --no-translations --dir $stage "$stage\MdsScope.exe"
          Copy-Item resources "$stage\resources" -Recurse -ErrorAction SilentlyContinue
          Copy-Item COPYING $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "build\MdsScope-windows-${{ matrix.arch }}.zip" -Force

      - name: Package EXE
        shell: pwsh
        run: |
          Copy-Item build\Release\MdsScope.exe "build\MdsScope-windows-${{ matrix.arch }}.exe"

      - name: Package MSI
        shell: pwsh
        continue-on-error: true
        run: |
          choco install wixtoolset -y --version=3.11.2 --no-progress
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          $stage = "$env:GITHUB_WORKSPACE\build\windows-package\MdsScope"
          & "$wixBin\heat.exe" dir "$stage" -dr INSTALLFOLDER -cg ApplicationGroup \
            -gg -g1 -sfrag -srd -scom -svb -var var.SourceDir \
            -out build\wix-files.wxs
          & "$wixBin\candle.exe" build\wix-files.wxs `
            -dSourceDir="$stage" -arch ${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }} `
            -out build\wix-files.wixobj
          & "$wixBin\light.exe" build\wix-files.wixobj `
            -ext WixUIExtension -cultures:en-us `
            -out "build\MdsScope-windows-${{ matrix.arch }}.msi"

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-windows-${{ matrix.arch }}-zip
          path: build/MdsScope-windows-${{ matrix.arch }}.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-windows-${{ matrix.arch }}-exe
          path: build/MdsScope-windows-${{ matrix.arch }}.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-windows-${{ matrix.arch }}-msi
          path: build/MdsScope-windows-${{ matrix.arch }}.msi

  # ── Android ────────────────────────────────────────────────────────────────

  android:
    name: Android (arm64)
    runs-on: ubuntu-26.04
    if: ${{ inputs.target == 'all' || inputs.target == 'android' || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          rm -rf $ANDROID_HOME/platforms/* || true
          sdkmanager "platforms;android-33" || true

      - name: Install Qt Desktop
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: linux
          target: desktop
          arch: gcc_64

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.4.3"
          host: linux
          target: android
          arch: android_arm64_v8a

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.Qt6_DIR }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DQT_HOST_PATH="${{ env.Qt6_DIR }}/../gcc_64"

      - name: Build APK
        env:
          ANDROID_BUILD_PLATFORM: android-33
        run: cmake --build build --target MdsScope_make_apk -j4

      - name: Rename APK
        run: |
          apk=$(find build -name "*.apk" | head -1)
          cp "$apk" build/MdsScope-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MdsScope-android-arm64-apk
          path: build/MdsScope-android-arm64.apk

  # ── GitHub Release ────────────────────────────────────────────────────────

  release:
    name: Create GitHub Release
    needs:
      - linux
      - macos
      - windows
      - android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: MdsScope-*
          merge-multiple: true

      - name: Flatten for release
        run: |
          mkdir -p release
          find artifacts -type f | while read f; do
            cp "$f" "release/$(basename "$f")"
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
